name=leaksense-p2

# Self-contained for local Workbench / CLI builds.
# JsonParserGeneratorRK is VENDORED in lib/ because the local toolchain does not
# auto-fetch registry dependencies into lib/. No registry dependency is required
# for the default configuration.
#
# Build:  particle compile p2 . --target 6.4.1
#
# Host syntax check + binning behaviour tests (no Particle toolchain needed):
#         tools/hostcheck/check.sh
#
# The optional IMU (USE_IMU in app_config.h, OFF by default) is not in the
# Particle registry; vendor Adafruit_LSM6DS / Adafruit_BusIO / Adafruit_Sensor
# into lib/ before enabling it.
